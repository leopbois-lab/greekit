name: How much fart CI

# Tests et build de l'app web à chaque pull request qui la touche.
on:
  pull_request:
    paths:
      - "how-much-fart/**"
      - ".github/workflows/how-much-fart-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: how-much-fart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: how-much-fart/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
