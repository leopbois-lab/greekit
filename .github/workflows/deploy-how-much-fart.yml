name: Deploy The carbon quest

# Construit l'app web de how-much-fart/ et la publie sur GitHub Pages
# (HTTPS, nécessaire pour la caméra et l'installation en PWA sur iPhone).
# Prérequis, une seule fois : Settings → Pages → Source : « GitHub Actions ».

on:
  push:
    branches: [main]
    paths:
      - "how-much-fart/**"
      - ".github/workflows/deploy-how-much-fart.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: how-much-fart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: how-much-fart/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: how-much-fart/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
